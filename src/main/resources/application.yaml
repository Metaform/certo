spring:
  application:
    name: certo
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer of management-API access tokens (/management/** is an OAuth2 resource server. Validation follows
          # the issuer's OIDC discovery/JWKS: signature, iss, exp/nbf. The decoder is resolved lazily,
          # so an unreachable issuer does not block startup — management calls fail 401 until it is up.
          issuer-uri: ${CERTO_MGMT_ISSUER_URI:http://localhost:8081}
          # To additionally pin the audience claim, set: audiences: certo-mgmt-api
  # Persistence runs on Spring Data JPA. By default (dev/test) Spring Boot auto-configures an embedded
  # in-memory H2 database (a uniquely-named instance per application context, so tests are isolated); the
  # `prod` profile below swaps in Postgres. Concurrency control (unique constraints, @Version optimistic
  # locking) comes from the database, so it is correct across a cluster.
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: 8080

certo:
  # Seed a few sample certificates (with generated PDFs) at startup so the search/retrieval endpoints
  # return data on a fresh run. Off by default; the test suite enables it via the Gradle test task.
  seed-sample-data: false
  # Identity of the sample tenants created by ProviderCertificateSeeder (only when seed-sample-data=true).
  # Real tenants are created at runtime via POST /management/v1/participant-contexts and carry their own
  # bpn/source/did; these values are NOT used as a runtime identity default.
  provider:
    bpn: BPNL0000000001AB
    source: urn:bpn:BPNL0000000001AB
  consumer:
    bpn: BPNL0000000002CD
    source: urn:bpn:BPNL0000000002CD
  # Security tokens on the CCM protocol layer are always on and always come from a siglet STS: inbound calls
  # are verified via POST /tokens/verify and outbound calls resolve their token AND counterparty endpoint from
  # GET /tokens/{participantContextId}/{flowId}. A siglet is required (point at a mock siglet for dev/test).
  security:
    siglet-base-url: http://localhost:8090
    # Authentication for the calls certo makes TO siglet (both /tokens/verify and the outbound token
    # lookup). OFF by default, which keeps those calls unauthenticated exactly as before. When enabled,
    # each siglet call first performs an RFC 8693 token exchange at `url`, sending the pod's Kubernetes
    # ServiceAccount JWT as subject_token and receiving a short-lived bearer for siglet. Nothing is
    # cached — one exchange per siglet call — and the subject token is re-read from disk each time
    # because the kubelet rotates a projected ServiceAccount token in place.
    #
    # The exchange's `resource` names the participant context the token is for: outbound lookups are
    # per-tenant and pass their own participantContextId, while /tokens/verify is not bound to a tenant
    # (the tenant is only known after siglet answers) and so uses `verify-resource`.
    #
    # Enabling it requires url, scope, audience and verify-resource; a missing one fails at startup.
    token-exchange:
      enabled: ${CERTO_SECURITY_TOKENEXCHANGE_ENABLED:false}
      url: ${CERTO_SECURITY_TOKENEXCHANGE_URL:}
      scope: ${CERTO_SECURITY_TOKENEXCHANGE_SCOPE:}
      audience: ${CERTO_SECURITY_TOKENEXCHANGE_AUDIENCE:}
      verify-resource: ${CERTO_SECURITY_TOKENEXCHANGE_VERIFYRESOURCE:}
      subject-token-path: ${CERTO_SECURITY_TOKENEXCHANGE_SUBJECTTOKENPATH:/var/run/secrets/kubernetes.io/serviceaccount/token}
  # Certificate-exchange status changes (CX-0135 §2.1.3) published as CloudEvents onto a NATS JetStream
  # stream, the way the platform's EDC runtimes publish theirs — subjects events.certificate.exchange.*,
  # so a consumer of the shared `edc-events` stream sees them alongside the connector's. OFF by default:
  # with `enabled: false` no connection is made and the publisher bean does not exist, so certo runs
  # exactly as before unless a deployment opts in.
  events:
    nats:
      enabled: ${CERTO_EVENTS_NATS_ENABLED:false}
      url: ${CERTO_EVENTS_NATS_URL:nats://localhost:4222}
      stream: ${CERTO_EVENTS_NATS_STREAM:edc-events}
      # Standalone development only: in the platform the stream is owned by the nats-bootstrap job and
      # certo's NATS user has no stream-management rights.
      create-stream: ${CERTO_EVENTS_NATS_CREATESTREAM:false}
      # Vault-delivered ed25519 seed, e.g. /vault/secrets/nats.nk. Blank connects unauthenticated.
      nkey-seed-path: ${CERTO_EVENTS_NATS_NKEYSEEDPATH:}
      # CloudEvents `source`: the emitting APPLICATION, matching the EDC runtimes (whose events-nats
      # bridge uses their Hostname service). Blank resolves to $HOSTNAME — the pod name in
      # Kubernetes — or the local hostname. Set it for a stable logical name instead of a per-pod
      # one. The emitting TENANT is carried by the sourcebpn extension, not here.
      source: ${CERTO_EVENTS_NATS_SOURCE:}
  # Outbound OkHttp client, shared across all adapters (routed through RetryingHttpClient). Timeouts are in
  # seconds (0 disables a given timeout). Retry (Failsafe, like EDC's EdcHttpClient) retries a transient
  # IOException or 5xx with exponential backoff. Every outbound call is idempotent so retry is safe: reads;
  # the notification/acceptance messages correlated by exchangeId (CX-0135 §2.1.1); and the request-open,
  # which the provider resolves as find-or-create over a still-live exchange rather than opening a duplicate.
  # Backoff is in millis.
  http:
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    write-timeout-seconds: 30
    call-timeout-seconds: 60
    max-retries: 5
    min-backoff-millis: 500
    max-backoff-millis: 10000

logging:
  level:
    org.metaform.certo: INFO

---
# Production profile: Postgres instead of embedded H2. The schema is expected to already exist
# (managed out of band, e.g. Flyway) so Hibernate only validates it rather than generating DDL.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${CERTO_DB_URL:jdbc:postgresql://localhost:5432/certo}
    username: ${CERTO_DB_USER:certo}
    password: ${CERTO_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
