apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certo.fullname" . }}
  labels:
    {{- include "certo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "certo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "certo.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.serviceAccount.name }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.events.nats.enabled .Values.natsAuth.enabled }}
      initContainers:
        # Logs into Vault with the pod's SA token and drops certo's NATS NKey seed on a pod-private
        # in-memory volume. It only FETCHES an identity that must already have been provisioned —
        # see the natsAuth notes in values.yaml, which the stock Core Platform Distribution does not
        # do for certo.
        #
        # The retry is unbounded by design (Vault and its bootstrap come up asynchronously), so a
        # missing role or seed leaves the pod in Init:0/1 rather than failing fast. Vault's error is
        # deliberately NOT sent to /dev/null: "invalid role name" is exactly what you need to see here.
        - name: fetch-nats-nkey
          image: {{ .Values.natsAuth.image }}
          command: [ "sh", "-ec" ]
          args:
            - |
              export VAULT_ADDR={{ .Values.natsAuth.vaultUrl | quote }}
              echo "Fetching the NATS NKey seed (Vault role {{ .Values.natsAuth.vaultRole }})..."
              until VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                  role={{ .Values.natsAuth.vaultRole }} \
                  jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token); do
                echo "Vault login failed (Vault or its bootstrap not ready yet), retrying in 2 seconds..."
                sleep 2
              done
              export VAULT_TOKEN
              until vault kv get -field=seed {{ .Values.natsAuth.vaultSecretPath }} > /vault/secrets/nats.nk; do
                echo "Seed not in Vault yet (nats-auth-bootstrap still running?), retrying in 2 seconds..."
                sleep 2
              done
              # 0444 rather than 0400: init and app container may run as different UIDs;
              # the volume is pod-private tmpfs either way.
              chmod 0444 /vault/secrets/nats.nk
              echo "NKey seed written to /vault/secrets/nats.nk"
          volumeMounts:
            - name: nats-nkey
              mountPath: /vault/secrets
      {{- end }}
      containers:
        - name: certo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            {{- if .Values.debug.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend={{ ternary "y" "n" .Values.debug.suspend }},address=*:{{ .Values.debug.port }}"
            {{- end }}
            - name: CERTO_DB_URL
              value: {{ .Values.database.url | quote }}
            - name: CERTO_DB_USER
              value: {{ .Values.database.username | quote }}
            - name: CERTO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-db" (include "certo.fullname" .)) }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- with .Values.database.ddlAuto }}
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.sigletBaseUrl }}
            - name: CERTO_SECURITY_SIGLETBASEURL
              value: {{ .Values.sigletBaseUrl | quote }}
            {{- end }}
            {{- if .Values.tokenExchange.enabled }}
            - name: CERTO_SECURITY_TOKENEXCHANGE_ENABLED
              value: "true"
            - name: CERTO_SECURITY_TOKENEXCHANGE_URL
              value: {{ .Values.tokenExchange.url | quote }}
            - name: CERTO_SECURITY_TOKENEXCHANGE_SCOPE
              value: {{ .Values.tokenExchange.scope | quote }}
            - name: CERTO_SECURITY_TOKENEXCHANGE_AUDIENCE
              value: {{ .Values.tokenExchange.audience | quote }}
            - name: CERTO_SECURITY_TOKENEXCHANGE_VERIFYRESOURCE
              value: {{ .Values.tokenExchange.verifyResource | quote }}
            {{- if .Values.tokenExchange.subjectTokenAudience }}
            # Projected ServiceAccount token minted for the broker's expected audience; the default
            # auto-mounted token is addressed to the API server and its TokenReview would reject it.
            - name: CERTO_SECURITY_TOKENEXCHANGE_SUBJECTTOKENPATH
              value: /var/run/secrets/certo/token-exchange/token
            {{- end }}
            {{- end }}
            {{- if .Values.events.nats.enabled }}
            - name: CERTO_EVENTS_NATS_ENABLED
              value: "true"
            - name: CERTO_EVENTS_NATS_URL
              value: {{ .Values.events.nats.url | quote }}
            - name: CERTO_EVENTS_NATS_STREAM
              value: {{ .Values.events.nats.stream | quote }}
            - name: CERTO_EVENTS_NATS_CREATESTREAM
              value: {{ .Values.events.nats.createStream | quote }}
            {{- if .Values.natsAuth.enabled }}
            - name: CERTO_EVENTS_NATS_NKEYSEEDPATH
              value: /vault/secrets/nats.nk
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # No actuator in the app, so probe the server socket rather than an HTTP health endpoint.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          {{- if or (and .Values.events.nats.enabled .Values.natsAuth.enabled) (and .Values.tokenExchange.enabled .Values.tokenExchange.subjectTokenAudience) }}
          volumeMounts:
            {{- if and .Values.events.nats.enabled .Values.natsAuth.enabled }}
            - name: nats-nkey
              mountPath: /vault/secrets
              readOnly: true
            {{- end }}
            {{- if and .Values.tokenExchange.enabled .Values.tokenExchange.subjectTokenAudience }}
            - name: token-exchange-sa-token
              mountPath: /var/run/secrets/certo/token-exchange
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or (and .Values.events.nats.enabled .Values.natsAuth.enabled) (and .Values.tokenExchange.enabled .Values.tokenExchange.subjectTokenAudience) }}
      volumes:
        {{- if and .Values.events.nats.enabled .Values.natsAuth.enabled }}
        # Pod-private in-memory volume the NKey seed is delivered on (never hits disk)
        - name: nats-nkey
          emptyDir:
            medium: Memory
        {{- end }}
        {{- if and .Values.tokenExchange.enabled .Values.tokenExchange.subjectTokenAudience }}
        # ServiceAccount token minted for the token-exchange broker's audience, which it checks with a
        # TokenReview. The kubelet rotates it in place, so certo re-reads the file on every exchange.
        - name: token-exchange-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.tokenExchange.subjectTokenAudience | quote }}
                  expirationSeconds: 3600
        {{- end }}
      {{- end }}
