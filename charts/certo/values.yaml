replicaCount: 1

image:
  repository: ghcr.io/metaform/certo
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

# Remote JVM debugging (JDWP). When enabled the container starts the debug agent (via
# JAVA_TOOL_OPTIONS, honored by any JVM launcher) and exposes the port on the pod only —
# deliberately not on the Service. Attach with
#   kubectl port-forward deploy/<fullname> 5005:5005
# and an IDE "Remote JVM Debug" run configuration pointed at localhost:5005.
debug:
  enabled: false
  port: 5005
  # Suspend the JVM until a debugger attaches (to step through startup code). While suspended the
  # app cannot answer health probes, so enabling this also disables liveness/readiness probes.
  suspend: false


# Gateway API: when `name` is set, the chart renders an HTTPRoute binding the service to
# that Gateway; when empty, no HTTPRoute is created.
gateway:
  # Name of the Gateway to attach to.
  name: ""
  # Namespace of the Gateway; defaults to the release namespace.
  namespace: ""
  # Optional listener (sectionName) on the Gateway.
  sectionName: ""
  # Hostnames to match; empty matches all hostnames of the listener.
  hostnames: []
  # Path prefix the route matches; forwarded to the service unchanged (no rewrite).
  pathPrefix: /api/certo

# Active Spring profile. `prod` (the image default) expects Postgres and an existing schema.
springProfile: prod

# Base URL of the siglet STS (certo.security.siglet-base-url). Required for the CCM protocol
# layer; point it at a mock siglet for dev/test.
sigletBaseUrl: ""

# Authentication for the calls certo makes TO siglet — both the inbound POST /tokens/verify and the
# outbound token lookup. OFF by default, leaving those calls unauthenticated.
#
# When enabled, each siglet call first runs an RFC 8693 token exchange at `url`, sending the pod's
# Kubernetes ServiceAccount JWT as subject_token and getting back a short-lived bearer for siglet.
# The exchange's `resource` is the participant context the token is for: the outbound lookup passes
# its own participantContextId, while /tokens/verify is not bound to a tenant and uses
# `verifyResource`.
#
# `url`, `scope`, `audience` and `verifyResource` are all required once enabled — certo fails at
# startup if one is missing.
tokenExchange:
  enabled: false
  # The broker's RFC 8693 token endpoint, e.g. http://jwtlet:8080/token
  url: ""
  # Space-separated scopes requested for the exchanged token. Must be a subset of what the broker's
  # resource mapping grants this ServiceAccount, or the exchange is rejected.
  scope: ""
  # The `aud` requested for the exchanged token — the siglet it is presented to.
  audience: ""
  # The participant context used as `resource` for the tenant-independent /tokens/verify call.
  verifyResource: ""
  # Audience of the ServiceAccount token sent as subject_token. The broker verifies it with a
  # TokenReview against its own configured client audience, so the default auto-mounted token
  # (addressed to the API server) is normally rejected. Setting this mounts a projected token minted
  # for the given audience and points certo at it; leaving it empty falls back to the default mount.
  subjectTokenAudience: ""

# Certificate-exchange status changes (CX-0135 §2.1.3) published as CloudEvents on NATS JetStream,
# on subjects events.certificate.exchange.* — the same shape and stream the platform's EDC runtimes
# publish to, so consumers of `edc-events` see certo's events alongside the connector's.
#
# ON by default — emitting these events is part of what certo is for. Set `enabled: false` to run
# certo with no broker dependency at all (it then makes no NATS connection and the publisher bean
# does not exist). `url` must point at a reachable NATS server whenever this is on.
events:
  nats:
    enabled: true
    url: nats://nats:4222
    # The stream events are expected to land on. Only used when createStream is set: a publish
    # addresses a subject, and the server routes it to whichever stream captures that subject.
    stream: edc-events
    # Create the stream if missing. Standalone/dev only — in the platform the stream is owned by the
    # nats-bootstrap job and certo's NATS user has no stream-management rights.
    createStream: false

# NKey authentication for the NATS connection. When enabled an init container logs into Vault with
# the pod's ServiceAccount token and drops the seed on a pod-private in-memory volume, exactly as the
# platform's other NATS clients do.
#
# ON by default, matching the platform's posture that every NATS client authenticates.
#
# It requires a certo NATS identity to already exist: a Vault k8s-auth role bound to this pod's
# ServiceAccount, a seed under `vaultSecretPath`, and a users.conf entry permitting
# `publish: ["events.>", "$JS.API.>"]`. Note the Core Platform Distribution provisions identities for
# its own components from a fixed list (controlplane, identityhub, issuerservice, cfm-agents,
# nats-admin) that does NOT yet include certo — against such a platform there is nothing to fetch,
# the init container retries indefinitely and the pod stays in Init:0/1.
#
# Set `enabled: false` where NATS runs without authentication; publishing then still works, over an
# unauthenticated connection. That is what the CX-VE install script does today.
natsAuth:
  enabled: true
  vaultUrl: http://vault:8200
  # Defaults to REUSING the platform's shared `edc-events` identity — certo publishes on events.>,
  # which is that identity's profile — rather than requiring a user of its own. The deployment must
  # add certo's ServiceAccount to that identity's serviceAccounts list on the platform side.
  # Both are configurable so this also works against whatever else mints certo an identity.
  vaultRole: nats-edc-events
  vaultSecretPath: secret/nats/edc-events
  image: hashicorp/vault:latest

database:
  url: jdbc:postgresql://postgres:5432/certo
  username: certo
  password: ""
  # Name of an existing Secret holding the DB password instead of `password` above.
  existingSecret: ""
  existingSecretKey: password
  # Hibernate schema handling (spring.jpa.hibernate.ddl-auto): none, validate, update,
  # create or create-drop. Empty keeps the app's profile default (`validate` under prod).
  ddlAuto: ""

# Additional environment variables for the container, in Kubernetes EnvVar format.
extraEnv: []

resources: {}
  # limits:
  #   memory: 1Gi
  # requests:
  #   cpu: 250m
  #   memory: 512Mi


# The app's workload identity: the jwtlet seed job registers
# "system:serviceaccount:<namespace>:onboarding-api", and Vault's kubernetes auth method binds
# the NKey role to this SA.
serviceAccount:
  create: true
  name: certo